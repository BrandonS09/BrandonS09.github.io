- title: Experience
  type: time_table
  contents:
    - title: Research Intern
      institution: SHAPE Lab, Stanford University
      year: May 2026 - Present
      description:
        - Developed Touch2Learn, a custom modification of Sony's Toio tangible robot platform featuring a redesigned hot-swappable side attachment system and improved electrical pin connection reliability based on the HERMIT architecture, extending the platform for accessible spatial communication of basketball play replays to blind and low-vision users
        - Independently designed and built a fleet of haptic tabletop micro-robots targeting UIST publication, encompassing full mechanical design of 30mm omnidirectional chassis, dual custom PCBs per robot (nRF52832, Nordic ESB radio, optical localization via PMW3360, vibrotactile haptics via DRV2605L), and bare-metal embedded firmware in C on the nRF5 SDK
        - Iterated through extensive physical prototyping to validate core mechanical unknowns, including SLA-printed omnidirectional wheel geometry at 30mm scale, magnetic coupling strength through a Delrin panel, and 90° worm gearbox torque transmission, diagnosing and resolving failure modes such as axle-induced roller binding misattributed to surface friction, and antenna RF path shorts traced through systematic electrical bring-up of custom PCBs


    - title: Chief Technology Officer/Co-Captain
      institution: FRC Team 199, Carlmont High School
      year: Aug 2023 - Jun 2026
      description:
        - Previously served as the Lead Design Engineering, and a Project Lead for a subsystem of the robot
        - Own technical roadmap and systems architecture for a 120lb competition robot, making final decision across mechanical, electrical, and software subsystems
        - Coordinate cross-functionally across sensing, actuation, programming, and fabrication teams to maintain design coherence from requirements through competition
        - Establish and enforce mechanical and electrical standards; mentor and train junior engineers in DFM/DFA
          principles, GD&T, and design review processes
        - Led robot architecture definition for 2025 season, translating competition requirements into integrated
          system design; team placed 8th of 55, becoming alliance captain
        - Served as primary developer for end effector and elevator subsystems in Java across two competition
          seasons, implementing PID control loops for precise motor positioning

    - title: Robotics Engineering Intern
      institution: Verdant Robotics, Hayward CA
      year: Jun 2025 - Aug 2025
      description:
        - Designed and fabricated a modular gantry-style motorized test track from the ground up, integrating mechanical, electrical, and control systems to support continuous 24/7 operation
        - Developed the complete mechanical system in Onshape using DFM/DFA principles and FEA validation,
         optimizing for manufacturability, structural rigidity, and ease of assembly
        - Engineered and implemented a high-power electrical system capable of reliably driving a 150+ lb payload at
         5 mph, with integrated safety features and efficient power distribution

- title: Open Source Projects
  type: time_table
