    - title: <a href="https://github.com/brandonshen123/SearchVision">Search Vision</a>
      year: Sept 2024 - Present
      description: Open-source platform for end-to-end custom object detection model creation. The system integrates Google Custom Search API, diversity-aware image selection via ResNet50, automated web scraping, and YOLOv8 fine-tuning into a unified no-code workflow. Available on GitHub under AGPL-3.0.

